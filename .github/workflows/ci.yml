name: Deploy FastAPI to AWS ECR       

on:
  push:
    # 當 push 到 main 分支時觸發
    branches: [ main ] 
env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: my-app-repo     
  
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |          
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80 | tee pytest.log
          
      # 🤖 AI Failure diagnosis: Only triggered when the test fails!
      - name: AI Diagnosis on Failure
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import os, requests
          
          
          api_key = os.environ.get('OPENAI_API_KEY')
          if not api_key:
              print('Error:Lack of OPENAI_API_KEY, Cannot be repaired.')
              exit(0)

          try:
              with open('pytest.log', 'r') as f:
                  log_content = f.read()
          except Exception as e:
              log_content = f'Cannot read log file: {e}'
          
          prompt = (f'Please analyze the following pytest test failure log in English. Provide a concise'
                    f'root-cause diagnosis and step-by-step fix recommendations:\n\n{log_content}'
                   ) 
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json'
          }

          data = {
              'model': 'gpt-4o-mini',
              'messages': [{'role': 'user', 'content': prompt}]
          }

          try:
              res = requests.post('https://api.openai.com/v1/chat/completions', json=data, headers=headers, timeout=30)
              if res.status_code == 200:
                  analysis = res.json()['choices'][0]['message']['content']
                  print('\n----------------------------------------')
                  print('           🤖 AI Error Diagnosis Report   ')
                  print('----------------------------------------\n')
                  print(analysis)
              else:
                  print(f'AI Analysis Failed: {res.status_code} - {res.text}')
          except Exception as e:
              print(f'AI Request Exception: {e}')
          "

  # ----------------------------------------------------
  # 2. 🤖 Pull Request AI Code Review
  # ----------------------------------------------------
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit AI PR Review
        uses: coderabbitai/coderabbit-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build-and-push-aws:
    name: Build and Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 【核心步驟 1】持剛拿到的兩把鑰匙，登入 AWS 警衛室
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1 # 確認是東京區域

      # 【核心步驟 2】讓這台 GitHub 伺服器登入 AWS 的 ECR 倉庫
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 【核心步驟 3】打包 Docker Image 並推送到 AWS ECR 倉庫
      - name: Build, tag, and push image to Amazon ECR
        env:
          AWS_REGION: ap-northeast-1                                       
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-app-repo                                   
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .         
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG  


      # 👈 【新增核心步驟 4】強制通知 ECS 重新拉取新 Image 並部署
      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster "my-ecs-cluster" \
            --service "my-ecs-service" \
            --force-new-deployment \
            --region ap-northeast-1      